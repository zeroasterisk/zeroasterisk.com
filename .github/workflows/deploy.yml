name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.121.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Setup Node.js (for any future JS processing)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./public

  # Test build on PRs (don't deploy)
  test-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      HUGO_VERSION: 0.121.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Test build
        run: |
          hugo --gc --minify --baseURL "https://test.example.com/"
          echo "✅ Hugo build successful - ready for production"

  # Deploy job - only runs on main branch pushes
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3

  # Verification job - runs after deployment
  verify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify deployment
        run: |
          echo "Verifying site is live..."
          sleep 30  # Give Pages time to propagate
          
          # Test homepage
          curl -sf "https://zeroasterisk.github.io/zeroasterisk.com/" > /dev/null || {
            echo "❌ Homepage not accessible"
            exit 1
          }
          
          # Test sample post URL
          curl -sf "https://zeroasterisk.github.io/zeroasterisk.com/2017/07/playing-with-elixir-is-just-fun/" > /dev/null || {
            echo "❌ Sample post URL not accessible"
            exit 1
          }
          
          # Test tags page
          curl -sf "https://zeroasterisk.github.io/zeroasterisk.com/tags/" > /dev/null || {
            echo "❌ Tags page not accessible"
            exit 1
          }
          
          echo "✅ All verification checks passed"